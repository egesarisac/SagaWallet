name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: us-central1-docker.pkg.dev
  GCP_PROJECT_ID: go-fintech-microservices
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  IMAGE_PREFIX: us-central1-docker.pkg.dev/go-fintech-microservices/go-fintech/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - wallet-service
          - transaction-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/setup-buildx-action@v3
      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}${{ matrix.service }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - wallet-service
          - transaction-service
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - id: image
        name: Resolve immutable image digest
        env:
          IMAGE_NAME: ${{ env.IMAGE_PREFIX }}${{ matrix.service }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE_NAME:$IMAGE_TAG" --format='value(image_summary.digest)')"
          test -n "$DIGEST"
          echo "reference=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.service }}
          image: ${{ steps.image.outputs.reference }}
          region: us-central1
      - name: Smoke test public API
        run: curl --fail --show-error --retry 6 --retry-all-errors --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"

  deploy-workers:
    name: Deploy GKE workers
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sagawallet-workers
          location: us-central1
      - name: Resolve worker image digests
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          resolve_image() {
            service="$1"
            variable="$2"
            image="${IMAGE_PREFIX}${service}:${IMAGE_TAG}"
            digest="$(gcloud artifacts docker images describe "$image" --format='value(image_summary.digest)')"
            test -n "$digest"
            echo "${variable}=${IMAGE_PREFIX}${service}@${digest}" >> "$GITHUB_ENV"
          }
          resolve_image wallet-service WALLET_IMAGE
          resolve_image transaction-service TRANSACTION_IMAGE
          resolve_image notification-service NOTIFICATION_IMAGE
      - name: Render and apply worker definitions
        run: |
          export WALLET_GRPC_ADDRESS="$(gcloud compute addresses describe sagawallet-wallet-grpc --region us-central1 --format='value(address)')"
          export WALLET_WORKER_GSA_EMAIL="sagawallet-wallet-worker@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          export TRANSACTION_WORKER_GSA_EMAIL="sagawallet-transaction-worker@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          export NOTIFICATION_WORKER_GSA_EMAIL="sagawallet-notification-worker@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          test -n "$WALLET_GRPC_ADDRESS"
          envsubst < deployments/kubernetes/workers.yaml | kubectl apply -f -
      - name: Wait for worker rollouts
        run: |
          kubectl rollout status deployment/wallet-worker --namespace saga-workers --timeout=180s
          kubectl rollout status deployment/transaction-worker --namespace saga-workers --timeout=180s
          kubectl rollout status deployment/notification-worker --namespace saga-workers --timeout=180s
