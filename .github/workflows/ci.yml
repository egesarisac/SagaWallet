name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - run: make fmt-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: '**/go.sum'
      - name: Run pinned golangci-lint
        run: make lint

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: api
            coverage_min: 0
            artifact: api
          - module: pkg
            coverage_min: 25
            artifact: pkg
          - module: pkg/errors
            coverage_min: 0
            artifact: pkg-errors
          - module: pkg/middleware
            coverage_min: 50
            artifact: pkg-middleware
          - module: services/auth-service
            coverage_min: 30
            artifact: auth-service
          - module: services/notification-service
            coverage_min: 20
            artifact: notification-service
          - module: services/transaction-service
            coverage_min: 5
            artifact: transaction-service
          - module: services/wallet-service
            coverage_min: 5
            artifact: wallet-service
          - module: tools/eventreplay
            coverage_min: 10
            artifact: eventreplay
          - module: tools/tokengen
            coverage_min: 0
            artifact: tokengen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: Run race tests and enforce coverage
        run: make test-module MODULE=${{ matrix.module }} COVERAGE_MIN=${{ matrix.coverage_min }}
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.artifact }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: error

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [format, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tests/integration/go.sum
      - name: Start the full stack
        run: docker compose -f docker-compose.full.yml up --build --detach --wait
      - name: Run integration tests
        run: make test-resilience
      - name: Collect service logs
        if: failure()
        run: docker compose -f docker-compose.full.yml logs --no-color
      - name: Stop the full stack
        if: always()
        run: docker compose -f docker-compose.full.yml down --volumes --remove-orphans

  contract:
    name: API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OpenAPI contracts
        run: make contract

  security:
    name: Security and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          syft-version: v1.18.1
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  pr-gate:
    name: PR Checks
    runs-on: ubuntu-latest
    needs: [integration, contract, security]
    steps:
      - run: echo "All validation checks passed."
