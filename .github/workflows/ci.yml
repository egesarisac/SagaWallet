name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: make fmt-check

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - api
          - pkg
          - pkg/errors
          - pkg/middleware
          - services/auth-service
          - services/notification-service
          - services/transaction-service
          - services/wallet-service
          - tests/integration
          - tools/eventreplay
          - tools/tokengen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.5
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - api
          - pkg
          - pkg/errors
          - pkg/middleware
          - services/auth-service
          - services/notification-service
          - services/transaction-service
          - services/wallet-service
          - tools/eventreplay
          - tools/tokengen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run unit tests with race detection
        working-directory: ${{ matrix.module }}
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: ignore

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [format, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tests/integration/go.sum
      - name: Start the full stack
        run: docker compose -f docker-compose.full.yml up --build --detach --wait
      - name: Run integration tests
        run: make test-integration
      - name: Collect service logs
        if: failure()
        run: docker compose -f docker-compose.full.yml logs --no-color
      - name: Stop the full stack
        if: always()
        run: docker compose -f docker-compose.full.yml down --volumes --remove-orphans

  contract:
    name: API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI contracts
        run: npx --yes @redocly/cli@1.25.0 lint docs/openapi.yaml docs/wallet-openapi.yaml docs/transaction-openapi.yaml

  security:
    name: Security and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository dependencies and configuration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  pr-gate:
    name: PR Checks
    runs-on: ubuntu-latest
    needs: [integration, contract, security]
    steps:
      - run: echo "All validation checks passed."
